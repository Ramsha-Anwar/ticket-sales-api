services:
  db:
    image: postgres:16
    container_name: ticket-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_sales
    ports:
      - "5433:5432"
    volumes:
      - ticket_sales_data:/var/lib/postgresql/data

volumes:
  ticket_sales_data: